<style>
:root{
  /* Layout: a full-bleed camera flies over the studio illustration; a glass dossier docks opposite the zone in focus, Prezi-style. */
  --night:#080d1b;
  --glass:rgba(10,17,36,.84);
  --text:#eef1fb;
  --muted:#a7b1cc;
  --amber:#f3b867;
  --holo:#86d8ff;
  --leaf:#a3e2a8;
  --line:rgba(188,208,255,.15);
  --ok:#5fe0a6; --warn:#ffc34d; --alert:#ff6a5c;
  --f-display:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-tech:"Chakra Petch","Noto Sans TC",ui-sans-serif,system-ui,sans-serif;
  --top:68px; --bottom:92px; --pw:520px; --sheet-h:50%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ol,ul{margin:0;padding:0;list-style:none}

/* ---------- scene ---------- */
.backdrop{position:fixed;inset:0;background:var(--night) url("office-bg.webp") center/cover no-repeat;filter:saturate(.9)}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform;--inv:1;--k:1}
#stage .bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
#win{position:absolute;left:0;top:0;overflow:hidden;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.55)}
#win img{position:absolute;left:0;top:0;width:1672px;height:941px;display:block;opacity:0;transition:opacity .8s ease;user-select:none;-webkit-user-drag:none}
#win img.ready{opacity:1}
.zf{position:absolute;border-radius:12px;border:1px solid transparent;opacity:0;pointer-events:none;transition:opacity .45s ease,border-color .45s ease,box-shadow .45s ease;--c:var(--holo)}
.zf{border-width:calc(1px*var(--k))}
.zf i{position:absolute;width:calc(32px*var(--k));height:calc(32px*var(--k));border:calc(3px*var(--k)) solid var(--c);filter:drop-shadow(0 0 calc(6px*var(--k)) var(--c));--o:calc(-4px*var(--k))}
.zf i:nth-child(1){left:var(--o);top:var(--o);border-right:0;border-bottom:0;border-radius:calc(14px*var(--k)) 0 0 0}
.zf i:nth-child(2){right:var(--o);top:var(--o);border-left:0;border-bottom:0;border-radius:0 calc(14px*var(--k)) 0 0}
.zf i:nth-child(3){right:var(--o);bottom:var(--o);border-left:0;border-top:0;border-radius:0 0 calc(14px*var(--k)) 0}
.zf i:nth-child(4){left:var(--o);bottom:var(--o);border-right:0;border-top:0;border-radius:0 0 0 calc(14px*var(--k))}
.zf.on,.zf.show{opacity:1;border-color:color-mix(in srgb,var(--c) 42%,transparent);box-shadow:0 0 34px color-mix(in srgb,var(--c) 28%,transparent),inset 0 0 50px color-mix(in srgb,var(--c) 12%,transparent)}
.zf.on i{animation:corner .8s cubic-bezier(.2,.8,.2,1) both}
.zf.hover{opacity:1;border-color:color-mix(in srgb,var(--c) 75%,transparent)}
.zf.show{border-width:calc(1.5px*var(--k));border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent)}
.zf.st1{--c:var(--holo)} .zf.st2{--c:var(--amber)} .zf.st3{--c:var(--leaf)}
.zf.dim{opacity:.18}
@keyframes corner{from{transform:scale(1.5);opacity:0}to{transform:none;opacity:1}}
.hit{position:absolute;background:transparent;border:0;padding:0;border-radius:12px;cursor:pointer}
.hit:focus-visible{outline-width:calc(2px*var(--inv))}
.chip{position:absolute;transform:translate(-50%,0);display:flex;align-items:center;gap:calc(5px*var(--inv));font:600 calc(10.5px*var(--inv))/1 var(--f-tech);letter-spacing:.08em;padding:calc(4px*var(--inv)) calc(8px*var(--inv));border-radius:999px;background:rgba(8,13,28,.82);color:var(--amber);border:calc(1px*var(--inv)) solid rgba(243,184,103,.55);opacity:0;transition:opacity .45s ease;white-space:nowrap;pointer-events:none}
.chip::before{content:"";width:calc(6px*var(--inv));height:calc(6px*var(--inv));border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(243,184,103,.7);animation:ping 2.4s infinite}
#stage.is-ov .chip{opacity:1}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(243,184,103,.7)}70%{box-shadow:0 0 0 calc(7px*var(--inv)) rgba(243,184,103,0)}100%{box-shadow:0 0 0 0 rgba(243,184,103,0)}}
#signsLayer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#dust{position:fixed;inset:0;pointer-events:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(4,7,16,.55) 100%)}

/* ---------- top bar ---------- */
.topbar{position:fixed;left:0;right:0;top:0;height:var(--top);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:0 20px;z-index:30;background:linear-gradient(to bottom,rgba(6,10,22,.88),rgba(6,10,22,.55) 60%,rgba(6,10,22,0))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand{transition:opacity .5s ease}
.at-ov:not(.is-mobile) .brand{opacity:0;pointer-events:none}
.brand img{width:36px;height:36px;flex:none;display:block}
.brand b{display:block;font:900 18px/1.15 var(--f-display);letter-spacing:.06em}
.brand small{display:block;font:500 11px/1.3 var(--f-tech);letter-spacing:.12em;color:var(--muted)}
.loc{justify-self:center;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.loc .lbl{font:600 11px var(--f-tech);letter-spacing:.18em;color:var(--holo)}
.loc .now{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeSwap .5s ease both}
@keyframes fadeSwap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctrls{display:flex;gap:8px}
.tb-btn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(12,20,40,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;cursor:pointer;transition:border-color .2s,background .2s}
.tb-btn:hover{border-color:rgba(243,184,103,.55);background:rgba(20,30,56,.85)}
.tb-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.tb-btn svg{width:16px;height:16px}
.zn{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font:700 12px/1 var(--f-tech);color:var(--amber)}

/* ---------- panel ---------- */
.panel{position:fixed;z-index:20;top:calc(var(--top) + 8px);width:var(--pw);max-height:calc(100% - var(--top) - var(--bottom) - 18px);overflow:auto;overscroll-behavior:contain;padding:24px 26px 20px;border-radius:22px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);transition:opacity .3s ease,transform .5s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.panel.side-right{right:22px}
.panel.side-left{left:22px}
.panel.band{top:auto;bottom:calc(var(--bottom) + 8px);left:22px;width:min(1140px,calc(100% - 44px));padding:26px 30px 24px}
.panel.sheet{top:auto;left:8px;right:8px;width:auto;bottom:calc(var(--bottom) + 4px);height:var(--sheet-h);max-height:none;padding:18px 18px 16px;border-radius:20px}
.panel.out{opacity:0;transform:translateY(14px) scale(.985)}
.panel.side-right.out{transform:translateX(24px)}
.panel.side-left.out{transform:translateX(-24px)}
.panel > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.p-zone{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.p-zone .zn{width:34px;height:34px;font-size:16px;border-width:2px;box-shadow:0 0 18px rgba(243,184,103,.35)}
.p-zone b{display:block;font-weight:700;font-size:15px;line-height:1.3}
.p-zone small{display:block;font:500 11.5px/1.3 var(--f-tech);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.p-chap{margin-left:auto;flex:none;font:600 11px/1 var(--f-tech);letter-spacing:.12em;color:var(--holo);border:1px solid rgba(134,216,255,.35);border-radius:999px;padding:6px 10px;white-space:nowrap}
.p-why{margin-top:12px;padding:8px 12px;border-left:2px solid var(--amber);background:linear-gradient(90deg,rgba(243,184,103,.1),transparent);font-size:13.5px;color:#e6dcc8;border-radius:0 8px 8px 0}
.p-eyebrow{margin-top:18px;font:600 12px/1 var(--f-tech);letter-spacing:.22em;color:var(--holo);text-transform:uppercase}
.p-head{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.p-no{font:700 64px/0.82 var(--f-tech);background:linear-gradient(170deg,#ffe2b0,var(--amber) 55%,#b9772f);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none;letter-spacing:-.02em}
.p-head h2{font:900 clamp(22px,2.1vw,30px)/1.25 var(--f-display);letter-spacing:.02em}
.p-lead{margin-top:12px;color:var(--muted);font-size:15px;max-width:60ch}
.p-body{display:grid;gap:14px;margin-top:18px}
.p-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font:500 11px/1.4 var(--f-tech);letter-spacing:.1em;color:#7f8aa8}

.blk{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);padding:14px 16px}
.blk-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 12px/1.3 var(--f-tech);letter-spacing:.14em;color:var(--holo);margin-bottom:10px;text-transform:uppercase}
.blk-t .cn{font-family:var(--f-body);letter-spacing:.04em;color:var(--text);font-size:13.5px;text-transform:none}
.hint{font-size:12.5px;color:#8a95b2}
.note{font-size:12.5px;color:#9aa5c2;padding:10px 12px;border-radius:10px;background:rgba(255,195,77,.06);border:1px dashed rgba(255,195,77,.28)}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tool{position:relative;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(134,216,255,.07),rgba(255,255,255,.02));min-height:150px}
.tool .k{font-size:12px;color:var(--muted)}
.tool .n{font:600 22px/1.15 var(--f-tech);letter-spacing:.02em}
.tool p{font-size:13.5px;color:#cfd6ea;flex:1}
.tool .x{font-size:12px;color:var(--amber)}
.acts{display:flex;gap:8px;margin-top:8px}
.btn-sm{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(243,184,103,.14);border:1px solid rgba(243,184,103,.5);color:#ffdcab;text-decoration:none;font-size:13px;cursor:pointer;transition:background .2s}
.btn-sm:hover{background:rgba(243,184,103,.26)}
.btn-qr{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:600 12px var(--f-tech);letter-spacing:.08em;cursor:pointer}
.btn-qr:hover{border-color:var(--holo)}
.ico{width:14px;height:14px;flex:none}
.qr-pop{position:absolute;inset:0;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;color:#0b1226;animation:rise .3s ease both}
.qr-pop[hidden]{display:none}
.qr-pop svg{width:104px;height:104px}
.qr-pop button{border:0;background:#0b1226;color:#fff;border-radius:999px;font-size:12px;padding:4px 12px;cursor:pointer}

/* compare */
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cmp{border-radius:14px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cmp-k{font:700 11px/1 var(--f-tech);letter-spacing:.24em}
.cmp .q{font:600 16px/1.6 var(--f-display)}
.cmp small{font-size:12.5px;color:var(--muted)}
.cmp.before{background:rgba(255,255,255,.025)} .cmp.before .cmp-k{color:#8a95b2} .cmp.before .q{color:#b9c1d8}
.cmp.after{background:linear-gradient(150deg,rgba(243,184,103,.16),rgba(243,184,103,.04));border-color:rgba(243,184,103,.5)} .cmp.after .cmp-k{color:var(--amber)}
.elems{display:flex;flex-wrap:wrap;gap:8px}
.elems li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:500}
.elems b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#24180a;font:700 12px var(--f-tech)}

/* flows */
.flow{display:flex;flex-wrap:wrap;gap:10px 22px}
.flow li{position:relative;flex:1 1 130px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px}
.flow li + li::before{content:"›";position:absolute;left:-16px;top:50%;transform:translateY(-50%);color:var(--amber);font:700 18px/1 var(--f-tech)}
.fl-k{font:600 11px/1.2 var(--f-tech);letter-spacing:.12em;color:var(--holo)}
.flow b{font-weight:700;font-size:14.5px;line-height:1.35}
.flow small{font-size:12.5px;color:var(--muted)}
.flow.pills li{flex:0 1 auto;padding:7px 12px;border-radius:999px;flex-direction:row;align-items:center;gap:8px}
.flow.pills b{font-size:13.5px;font-weight:500}
.flow.pills .fl-k{color:var(--amber)}
.flow.pills li:last-child{border-color:rgba(243,184,103,.6);background:rgba(243,184,103,.12)}
.lst{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.lst li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.035);font-size:14px}
.lst li span{font:600 12px var(--f-tech);color:var(--amber)}

/* cta */
.cta{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(120deg,rgba(134,216,255,.12),rgba(243,184,103,.1));border:1px solid rgba(134,216,255,.3)}
.cta-qr{display:block;width:104px;height:104px;border-radius:10px;overflow:hidden;background:#fff;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.cta-qr svg{width:100%;height:100%;display:block}
.cta-t{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.cta-tag{font:600 12px/1 var(--f-tech);letter-spacing:.16em;color:var(--holo)}
.btn-primary{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 18px;border-radius:999px;background:linear-gradient(180deg,#ffd394,var(--amber));color:#2a1a06;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 6px 20px rgba(243,184,103,.3);transition:transform .2s,box-shadow .2s;border:0;cursor:pointer}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(243,184,103,.45)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14.5px;cursor:pointer}
.btn-ghost:hover{border-color:var(--holo)}
.cta-d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tab-b{flex:1 1 calc(50% - 4px);min-height:34px;font-size:13px!important;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.tab-b:hover{color:var(--text)}
.tab-b[aria-selected="true"]{background:linear-gradient(180deg,#ffd394,var(--amber));color:#2a1a06;font-weight:700}
.tab-p{display:grid;gap:14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.tab-p[hidden]{display:none}
.brew{padding:18px;border-radius:16px;background:radial-gradient(120% 90% at 85% 0%,rgba(134,216,255,.16),transparent 60%),linear-gradient(160deg,#1d1a2c,#121626);border:1px solid rgba(134,216,255,.28)}
.brew-k{font:600 11px/1 var(--f-tech);letter-spacing:.22em;color:var(--holo)}
.brew-n{display:block;margin-top:8px;font:900 28px/1.2 var(--f-display);letter-spacing:.06em}
.brew-n em{font:600 15px var(--f-tech);font-style:normal;letter-spacing:.2em;color:var(--amber);margin-left:6px}
.brew-t{margin-top:8px;font:600 16px/1.6 var(--f-display);color:#e6dcc8}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.char{display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.char-cover{padding:0;border:0;border-radius:8px;overflow:hidden;background:#fbf7ee;cursor:zoom-in;aspect-ratio:4/3}
.char-cover img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto;transition:transform .4s}
.char-cover:hover img{transform:scale(1.05)}
.char b{font-size:14px}
.char p{font-size:12.5px;color:var(--muted);line-height:1.5}
.char-more{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.char-more button{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid rgba(134,216,255,.4);background:transparent;color:#d6f1ff;cursor:zoom-in}
.char-more button:hover{background:rgba(134,216,255,.15)}
.vid{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:14px;align-items:start}
.vid video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid var(--line)}
.vid-t{display:grid;gap:8px;font-size:13.5px}
.vid-t b{font:600 13px var(--f-tech);letter-spacing:.08em;color:var(--amber)}
.lightbox{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(4,7,16,.88);backdrop-filter:blur(6px);cursor:zoom-out;animation:fadeSwap .25s ease both}
.lightbox[hidden]{display:none}
.lightbox figure{margin:0;display:grid;gap:10px;justify-items:center;max-width:100%;max-height:100%}
.lightbox img{max-width:min(1200px,94vw);max-height:84vh;border-radius:12px;background:#fbf7ee;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox figcaption{font-size:14px;color:var(--text)}
.is-mobile .vid{grid-template-columns:1fr}
.is-mobile .vid video{max-width:240px}
.xref{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px dashed rgba(243,184,103,.45);font-size:13.5px}
.xref span{flex:1 1 200px}
.mm{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mm-c{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.mm-c header{display:flex;gap:10px;align-items:center}
.mm-face{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
.mm-c.r .mm-face{box-shadow:0 0 0 2px rgba(255,150,120,.45)}.mm-c.b .mm-face{box-shadow:0 0 0 2px rgba(246,217,131,.45)}
.mm-s{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;font:900 21px/1 var(--f-display);flex:none}
.mm-c.r .mm-s{background:linear-gradient(160deg,#d24a3c,#8e1f17);color:#ffe9d2}
.mm-c.b .mm-s{background:linear-gradient(160deg,#2f56b0,#152c66);color:#f6d983}
.mm-c b{display:block;font:900 17px/1.2 var(--f-display)}
.mm-c small{display:block;font-size:11.5px;color:var(--muted)}
.mm-m{font:600 13.5px/1.6 var(--f-display);color:#e6dcc8}
.mm-l{display:grid;gap:3px}
.mm-l li{font-size:13px;display:flex;gap:8px}
.mm-l li span{font:600 11.5px var(--f-tech);color:var(--amber);min-width:22px}
.mm-p{font-size:12.5px;color:#cfd6ea;padding-top:8px;border-top:1px dashed var(--line)}
.mm-p span{font:600 11px var(--f-tech);letter-spacing:.1em;color:var(--holo);margin-right:6px}
.game-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px;border-radius:16px;background:linear-gradient(120deg,rgba(210,74,60,.18),rgba(47,86,176,.22));border:1px solid rgba(243,184,103,.45)}
.game-cta > div{flex:1 1 220px;display:grid;gap:6px}
.game-cta b{font:900 20px/1.3 var(--f-display)}
.game-cta p{font-size:13px;color:#cfd6ea}
.steps3{display:grid;gap:10px}
.steps3 li{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.steps3 li > span{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--amber);color:#24180a;font:700 13px var(--f-tech)}
.steps3 b{font-size:14.5px}
.steps3 p{font-size:13px;color:#cfd6ea;margin:3px 0 8px}
.steps3 .btn-sm{font-size:12px}
.char-cover.notes{display:block;width:100%;aspect-ratio:auto;margin-top:10px;background:#0b1530}
.char-cover.notes img{height:auto}
.gdemo{display:grid;gap:10px}
.gd-win{position:relative;height:300px;border-radius:14px;background:#131722;border:1px solid rgba(255,255,255,.1);overflow:hidden;font-size:13px}
.gd-bar{display:flex;align-items:center;gap:5px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);color:#c9d1e6;font-weight:500}
.gd-bar i{width:8px;height:8px;border-radius:50%;background:#3a4155}.gd-bar span{margin-left:8px}
.gd-chat{position:absolute;inset:36px 12px 62px;overflow:hidden;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.gd-hello{align-self:center;margin:auto 0;font-size:18px;font-weight:500;background:linear-gradient(90deg,#86d8ff,#c3a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.gd-q{align-self:flex-end;max-width:80%;padding:7px 11px;border-radius:14px 14px 4px 14px;background:#2a3147;color:#eef1fb;animation:rise .35s ease both}
.gd-a{align-self:flex-start;max-width:92%;color:#dfe5f5;line-height:1.6;animation:rise .35s ease both}
.gd-a sup{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 3px;margin-left:2px;border-radius:5px;background:#2c3a5c;color:#9fd3ff;font-size:10px;vertical-align:2px}
.gd-src{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.gd-src span{font-size:11px;padding:3px 8px;border-radius:999px;background:#1f2638;color:#aab4cf;border:1px solid #2f3852}
.gd-input{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:#1d2230;border:1px solid #30374a}
.gd-plus{width:30px;height:30px;border-radius:50%;border:0;background:#2a3147;color:#dfe5f5;font-size:17px;flex:none;transition:background .2s}
.gd-plus.on{background:#45507a}
.gd-field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;color:#eef1fb}
.gd-ph{color:#7d869e}.gd-field .gd-ph.typed{color:#eef1fb}
.gd-chip{flex:none;font-size:11.5px;padding:3px 8px;border-radius:8px;background:#26365c;color:#bfe1ff;animation:rise .3s ease both}
.gd-chip[hidden]{display:none}
.gd-caret{width:1.5px;height:15px;background:#86d8ff;animation:blink 1s steps(2) infinite}
.gd-send{flex:none;color:#7d869e;font-size:14px;transition:color .2s}.gd-send.on{color:#86d8ff}
.gd-menu,.gd-sub,.gd-pick{position:absolute;background:#232a3b;border:1px solid #39415a;border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:rise .25s ease both}
.gd-menu[hidden],.gd-sub[hidden],.gd-pick[hidden]{display:none}
.gd-menu{left:12px;bottom:56px;width:170px}.gd-sub{left:186px;bottom:56px;width:130px}
.gd-pick{left:50%;top:50%;transform:translate(-50%,-50%);width:250px;animation:none}
.gd-pick p{margin:2px 6px 6px;font-weight:600;color:#eef1fb}
.gd-menu div,.gd-sub div,.gd-pick div{padding:7px 9px;border-radius:8px;color:#dfe5f5;transition:background .2s}
.gd-pick small{display:block;font-size:11px;color:#8d97b3}.gd-pick .dim{opacity:.55}
.gd-menu .hl,.gd-sub .hl,.gd-pick .hl{background:#38446a}
.gd-cursor{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(134,216,255,.35);transition:left .6s cubic-bezier(.3,.7,.2,1),top .6s cubic-bezier(.3,.7,.2,1),transform .15s;pointer-events:none;z-index:5}
.gd-cursor.tap{transform:scale(.7)}
.gd-steps{display:flex;flex-wrap:wrap;gap:5px;counter-reset:gd}
.gd-steps li{counter-increment:gd;font-size:12px;padding:4px 10px 4px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:all .3s}
.gd-steps li::before{content:counter(gd);display:inline-grid;place-items:center;width:17px;height:17px;margin-right:5px;border-radius:50%;background:rgba(255,255,255,.1);font:700 10px var(--f-tech)}
.gd-steps li.on{border-color:var(--amber);color:#fff;background:rgba(243,184,103,.14)}
.gd-steps li.on::before{background:var(--amber);color:#24180a}
.gd-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* factory sim */
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid9 li{display:flex;align-items:baseline;gap:8px;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:background .35s,border-color .35s,box-shadow .35s}
.grid9 li span{font:700 11px/1 var(--f-tech);letter-spacing:.1em;color:var(--holo)}
.grid9 li b{font-size:13.5px;font-weight:500}
.grid9 li.live{border-color:var(--ok);background:rgba(95,224,166,.12);box-shadow:0 0 16px rgba(95,224,166,.25)}
.sim.halt .grid9 li{border-color:rgba(255,106,92,.5);background:rgba(255,106,92,.08);box-shadow:none}
.tag-demo{font:600 10.5px/1 var(--f-tech);letter-spacing:.1em;color:#0b1226;background:var(--holo);padding:4px 7px;border-radius:6px;text-transform:none}
.states{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px}
.states li{position:relative;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;transition:all .3s}
.states li + li::before{content:"›";position:absolute;left:-13px;top:50%;transform:translateY(-50%);color:#6f7a98}
.states li.cur{border-color:var(--ok);color:#eafff5;background:rgba(95,224,166,.16);box-shadow:0 0 12px rgba(95,224,166,.3)}
.sim.halt .states li{opacity:.4}
.exc{display:flex;flex-wrap:wrap;gap:6px}
.exc li{padding:4px 10px;border-radius:6px;font-size:12.5px;border:1px solid}
.exc .w{border-color:rgba(255,195,77,.45);color:#ffd98a}
.exc .a{border-color:rgba(255,106,92,.5);color:#ffb1a8}
.sim.halt .exc .estop-chip{background:var(--alert);color:#fff;border-color:var(--alert);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.estop{margin-top:12px;display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:6px 16px 6px 8px;border-radius:999px;border:1px solid rgba(255,106,92,.6);background:rgba(255,106,92,.12);color:#ffd2cc;font-weight:700;cursor:pointer}
.estop-dot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a8f,#d8261a 60%,#8f1209);box-shadow:0 0 0 3px #ffcf3f,0 2px 6px rgba(0,0,0,.4)}
.sim.halt .estop{border-color:var(--ok);background:rgba(95,224,166,.12);color:#d9ffef}
.sim.halt .estop-dot{background:radial-gradient(circle at 35% 30%,#b7ffe0,#2fb67c 60%,#156b45);box-shadow:0 0 0 3px #d9ffef,0 2px 6px rgba(0,0,0,.4)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stat{border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat b{display:block;font:700 34px/1 var(--f-tech);color:var(--amber);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags li{padding:4px 11px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.tags.hot li{border-color:rgba(134,216,255,.45);color:#d6f1ff}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.feat li{padding:8px 10px;border-radius:10px;background:rgba(134,216,255,.07);font-size:13.5px}
.spec{display:inline-block;justify-self:start;font-size:12px;color:#ffd98a;border:1px solid rgba(255,195,77,.35);border-radius:6px;padding:3px 9px}
.res{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.res b{flex:1 1 70px;text-align:center;padding:12px 6px;border-radius:14px;font:900 22px/1 var(--f-display);background:radial-gradient(circle at 50% 0%,rgba(163,226,168,.22),rgba(255,255,255,.03));border:1px solid rgba(163,226,168,.35)}
.res i{font-style:normal;color:var(--amber);font:600 18px var(--f-tech)}
.principle{font-size:14px;padding:12px 14px;border-radius:12px;background:rgba(163,226,168,.08);border:1px solid rgba(163,226,168,.3);color:#e4f6e5}
.vis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vis li{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;background:radial-gradient(circle at 50% 20%,rgba(243,184,103,.18),rgba(255,255,255,.02));border:1px solid rgba(243,184,103,.3);font-size:13px;text-align:center}
.vis svg{width:40px;height:40px}
.ladder{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px}
.ladder li{position:relative;flex:1 1 120px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13.5px}
.ladder li + li::before{content:"→";position:absolute;left:-17px;top:50%;transform:translateY(-50%);color:var(--amber);font-family:var(--f-tech)}
.ladder li:last-child{border-color:rgba(243,184,103,.6);background:rgba(243,184,103,.12);font-weight:700}
.case{font:600 16px/1.6 var(--f-display)}

/* band: entrance + summary */
.band-grid{display:grid;grid-template-columns:minmax(280px,.85fr) 1.5fr;gap:28px;align-items:end}
.band-grid > *{min-width:0}
.cover-t{font:900 clamp(40px,4.4vw,64px)/1.05 var(--f-display);letter-spacing:.04em;background:linear-gradient(180deg,#fff,#d8e4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover-s{margin-top:10px;font:600 17px/1.4 var(--f-display);color:var(--amber);letter-spacing:.08em}
.cover-p{margin-top:12px;color:var(--muted);font-size:14.5px;max-width:42ch}
.chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chap{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
.chap:hover{border-color:rgba(243,184,103,.6);background:rgba(243,184,103,.08);transform:translateY(-2px)}
.chap .k{font:600 11px/1 var(--f-tech);letter-spacing:.16em;color:var(--holo)}
.chap b{font:900 19px/1.2 var(--f-display)}
.chap .zs{display:flex;gap:4px;flex-wrap:wrap}
.chap .zs .zn{width:20px;height:20px;font-size:11px;border-width:1.5px}
.chap .wide{font-size:12px;color:var(--muted)}
.band-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.stage{position:relative;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:border-color .25s,background .25s;--c:var(--holo)}
.stage + .stage::before{content:"›";position:absolute;left:-16px;top:50%;transform:translateY(-50%);color:var(--amber);font:700 20px var(--f-tech)}
.stage:nth-child(1){--c:var(--holo)} .stage:nth-child(2){--c:var(--amber)} .stage:nth-child(3){--c:var(--leaf)}
.stage:hover,.stage:focus-within{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.stage .k{font:700 26px/1 var(--f-tech);color:var(--c)}
.stage b{display:block;margin-top:6px;font:900 20px/1.2 var(--f-display)}
.stage p{margin-top:6px;font-size:13px;color:#cfd6ea}
.stage .zs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.stage .zs .zn{width:20px;height:20px;font-size:11px;color:var(--c)}
.closing{margin-top:14px;font:900 clamp(20px,2vw,26px)/1.35 var(--f-display);letter-spacing:.04em}
.closing em{font-style:normal;color:var(--amber)}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:30;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;background:rgba(9,15,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.4);max-width:calc(100% - 24px)}
.mini{position:relative;width:112px;height:63px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:#000;cursor:pointer;flex:none}
.mini img{width:100%;height:100%;display:block;opacity:.85}
.mini-view{position:absolute;border:1.5px solid var(--amber);box-shadow:0 0 0 999px rgba(4,8,18,.35);border-radius:2px;pointer-events:none}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer;flex:none;transition:border-color .2s,background .2s}
.nav:hover:not(:disabled){border-color:var(--amber);background:rgba(243,184,103,.12)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:18px;height:18px}
.tl{display:flex;align-items:flex-end;gap:14px;padding:0 4px}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.node,.grp-l{white-space:nowrap}
.grp-l{font-size:11px;color:#8a95b2;letter-spacing:.08em;white-space:nowrap;transition:color .3s}
.grp.cur .grp-l{color:var(--amber)}
.nodes{position:relative;display:flex;gap:6px}
.nodes::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:1px;background:var(--line)}
.node{position:relative;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(188,208,255,.35);background:#0d1530;display:grid;place-items:center;font:700 11.5px/1 var(--f-tech);color:var(--muted);cursor:pointer;padding:0;transition:all .3s}
.node:hover{border-color:var(--holo);color:var(--text)}
.node.seen{border-color:rgba(134,216,255,.7);color:#cfefff}
.node.cur{border-color:var(--amber);background:var(--amber);color:#24180a;box-shadow:0 0 16px rgba(243,184,103,.55);transform:scale(1.12)}
.node.wide{width:auto;padding:0 10px;border-radius:999px;font-family:var(--f-body);font-weight:500;font-size:12px}
.mcount{display:none;flex-direction:column;align-items:center;min-width:0;flex:1;font-size:12.5px;color:var(--muted);text-align:center}
.mcount b{font:700 15px var(--f-tech);color:var(--text);letter-spacing:.06em}
.mbar{display:block;width:100%;height:3px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--amber);transition:width .6s ease}

.topbar,.dock,.vignette{transition:opacity .5s ease}
.clean .topbar,.clean .panel,.clean .dock,.clean .tip,.clean .vignette{opacity:0!important;pointer-events:none!important}
.clean #stage .chip{opacity:0!important}
.clean-hint{position:fixed;z-index:50;left:50%;bottom:28px;transform:translate(-50%,10px);padding:10px 18px;border-radius:999px;background:rgba(7,12,26,.82);border:1px solid rgba(243,184,103,.45);font-size:14px;color:var(--text);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;white-space:nowrap}
.clean .clean-hint{animation:hintShow 3.6s ease both}
@keyframes hintShow{0%{opacity:0;transform:translate(-50%,10px)}12%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.tip{position:fixed;z-index:40;pointer-events:none;max-width:280px;padding:9px 12px;border-radius:12px;background:rgba(7,12,26,.94);border:1px solid rgba(243,184,103,.45);font-size:13px;line-height:1.45;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tip.on{opacity:1;transform:none}
.tip .s{display:block;font:600 11px var(--f-tech);letter-spacing:.14em;color:var(--holo)}
.tip .a{display:block;margin-top:4px;font-size:12px;color:var(--amber)}

/* ---------- entrance doors ---------- */
.doors{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center}
.door{position:absolute;top:0;bottom:0;width:50.2%;background:linear-gradient(180deg,#0c1430,#070b18);animation:doorL 1.5s cubic-bezier(.7,0,.2,1) .9s both}
.door.l{left:0;border-right:1px solid rgba(243,184,103,.6);box-shadow:inset -40px 0 80px rgba(243,184,103,.08)}
.door.r{right:0;border-left:1px solid rgba(243,184,103,.6);box-shadow:inset 40px 0 80px rgba(243,184,103,.08);animation-name:doorR}
.door::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px)}
@keyframes doorL{to{transform:translateX(-101%)}}
@keyframes doorR{to{transform:translateX(101%)}}
.door-logo{position:relative;text-align:center;animation:logoOut .7s ease .75s both}
.door-logo svg{width:84px;height:84px;filter:drop-shadow(0 0 22px rgba(134,216,255,.45))}
.door-logo b{display:block;margin-top:14px;font:900 clamp(26px,4vw,40px)/1.2 var(--f-display);letter-spacing:.12em}
.door-logo small{display:block;margin-top:6px;font:500 13px var(--f-tech);letter-spacing:.24em;color:var(--muted)}
@keyframes logoOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.08)}}
.doors.done{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .mini{display:none}
  .chapters{grid-template-columns:repeat(2,1fr)}
  .loc .lbl{display:none}
}
@media (max-width:980px){

/* ---------- camera ---------- */
let M = {};
function layout(){
  const VW = innerWidth, VH = innerHeight;
  isMobile = VW < 760 || VW / VH < 0.95;
  document.documentElement.classList.toggle('is-mobile', isMobile);
  const top = isMobile ? 56 : 68, bottom = isMobile ? 66 : 92;
  const pw = Math.round(Math.min(580, Math.max(360, VW * 0.36)));
  const sheetH = Math.round(Math.min(VH * 0.54, VH - top - bottom - 150));
  const r = document.documentElement.style;
  r.setProperty('--top', top + 'px'); r.setProperty('--bottom', bottom + 'px');
  r.setProperty('--pw', pw + 'px'); r.setProperty('--sheet-h', sheetH + 'px');
  M = {VW, VH, top, bottom, pw, sheetH};
  const sOv = camFor(STOPS[0]).s;
  stage.style.setProperty('--inv', (1 / sOv).toFixed(4));
  stage.style.setProperty('--k', (1 / (camNow && !flight ? camNow.s : sOv)).toFixed(4));
}
function viewFor(s){
  const {VW, VH, top, bottom, pw, sheetH} = M;
  if (cleanMode) return {x:0, y:0, w:VW, h:VH};
  if (isMobile) return {x:0, y:top, w:VW, h:VH - bottom - sheetH - top - 6};
  if (s.zone == null) return {x:0, y:0, w:VW, h:VH};
  const g = 22 + 26;
  return ZONES[s.zone].side === 'right'
    ? {x:0, y:top, w:VW - pw - g, h:VH - top - bottom}
    : {x:pw + g, y:top, w:VW - pw - g, h:VH - top - bottom};
}
function clampT(s, tx, ty, v){
  const iw = IW * s, ih = IH * s;
  if (iw >= v.w) tx = Math.min(v.x, Math.max(v.x + v.w - iw, tx));
  else tx = v.x + (v.w - iw) / 2;
  if (ih >= v.h) ty = Math.min(v.y, Math.max(v.y + v.h - ih, ty));
  else ty = v.y + (v.h - ih) / 2;
  return [tx, ty];
}
function camFor(s){
  const v = viewFor(s);
  const coverV = Math.max(v.w / IW, v.h / IH);
  let sc, fx, fy;
  if (s.zone == null){
    sc = isMobile ? Math.min(v.w / IW, v.h / IH) : Math.max(M.VW / IW, M.VH / IH); fx = IW / 2; fy = IH / 2;
  } else {
    const [x, y, w, h] = ZONES[s.zone].rect;
    sc = Math.min(v.w / w, v.h / h) * 0.95;
    sc = Math.max(coverV, Math.min(sc, isMobile ? 1.7 : 2.6));
    fx = x + w / 2; fy = y + h / 2;
  }
  let [tx, ty] = clampT(sc, v.x + v.w / 2 - fx * sc, v.y + v.h / 2 - fy * sc, v);
  return {s:sc, tx, ty, v};
}
const FULL = {x:0, y:0, w:IW, h:IH};
const rectFor = s => { if (s.zone == null) return FULL; const [x,y,w,h] = ZONES[s.zone].rect, p = 10; return {x:x-p, y:y-p, w:w+2*p, h:h+2*p}; };
const lerp = (a, b, t) => a + (b - a) * t;
const lerpR = (a, b, t) => ({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), w:lerp(a.w,b.w,t), h:lerp(a.h,b.h,t)});
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

let camNow = null, rectNow = FULL, flight = null;
function apply(c, r, now){
  let {s, tx, ty} = c;
  if (!reduce && !flight){ // gentle handheld drift while idle
    const k = now / 1000;
    const ds = 1 + Math.sin(k / 7.3) * 0.0025;
    const cx = M.VW / 2, cy = M.VH / 2;
    tx = cx - (cx - tx) * ds + Math.sin(k / 5.2) * 2.5; ty = cy - (cy - ty) * ds + Math.cos(k / 6.1) * 1.8; s *= ds;
  }
  stage.style.transform = `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) scale(${s.toFixed(5)})`;
  win.style.transform = `translate(${r.x}px,${r.y}px)`; win.style.width = r.w + 'px'; win.style.height = r.h + 'px';
  win.style.borderRadius = (r === FULL || (r.w >= IW - 1 && r.h >= IH - 1)) ? '0' : '12px';
  sharp.style.transform = `translate(${-r.x}px,${-r.y}px)`;
  // vector signs drawn in screen space so they stay sharp at any zoom
  signsG.setAttribute('transform', `matrix(${s.toFixed(5)} 0 0 ${s.toFixed(5)} ${tx.toFixed(2)} ${ty.toFixed(2)})`);
  const full = r === FULL || (r.w >= IW - 1 && r.h >= IH - 1);
  winClipRect.setAttribute('x', r.x); winClipRect.setAttribute('y', r.y); winClipRect.setAttribute('width', r.w); winClipRect.setAttribute('height', r.h);
  winClipRect.setAttribute('rx', full ? 0 : 12);
  // minimap viewport
  const mv = miniView;
  const mx = -tx / s, my = -ty / s, mw = M.VW / s, mh = M.VH / s, k2 = 112 / IW;
  mv.style.left = Math.max(0, mx * k2) + 'px'; mv.style.top = Math.max(0, my * k2) + 'px';
  mv.style.width = Math.min(112, mw * k2) + 'px'; mv.style.height = Math.min(63, mh * k2) + 'px';
}
function tick(now){
  if (flight){
    const f = flight; let t = (now - f.t0) / f.dur; if (t >= 1) t = 1;
    const e = ease(t);
    const v = {x:lerp(f.A.v.x,f.B.v.x,e), y:lerp(f.A.v.y,f.B.v.y,e), w:lerp(f.A.v.w,f.B.v.w,e), h:lerp(f.A.v.h,f.B.v.h,e)};
    const px = v.x + v.w/2, py = v.y + v.h/2;
    const fx = lerp(f.FA[0], f.FB[0], e), fy = lerp(f.FA[1], f.FB[1], e);
    let s = Math.exp(lerp(Math.log(f.A.s), Math.log(f.B.s), e) - f.bump * Math.sin(Math.PI * t));
    s = Math.max(s, f.floor);
    let [tx, ty] = clampT(s, px - fx * s, py - fy * s, v);
    let r = lerpR(f.RA, f.RB, e);
    if (f.RA !== FULL && f.RB !== FULL) r = lerpR(r, FULL, Math.pow(Math.sin(Math.PI * t), 1.3));
    camNow = {s, tx, ty, v}; rectNow = r;
    apply(camNow, r, now);
    if (t === 1){ camNow = f.B; rectNow = f.RB; flight = null; f.done(); }
  } else if (camNow) apply(camNow, rectNow, now);
  requestAnimationFrame(tick);
}
function focusOf(c){ const px = c.v.x + c.v.w/2, py = c.v.y + c.v.h/2; return [(px - c.tx) / c.s, (py - c.ty) / c.s]; }
function fly(B, RB, dur, done){
  const A = camNow;
  if (!A || reduce || dur === 0){ camNow = B; rectNow = RB; flight = null; done(); return; }
  const FA = focusOf(A), FB = focusOf(B);
  const dist = Math.hypot(FB[0]-FA[0], FB[1]-FA[1]) / IW;
  const coverFull = Math.max(M.VW / IW, M.VH / IH);
  flight = {A, B, FA, FB, RA:rectNow, RB, t0:performance.now(), dur:dur ?? (1250 + 750 * Math.min(1, dist * 1.4)),
    bump: Math.min(0.55, dist * 0.95), floor: Math.min(A.s, B.s, coverFull), done};
  return flight.dur;
}

/* ---------- navigation ---------- */
let simTimer = null, autoTimer = null, auto = false, panelTimer = null;
function locHTML(s){ return s.zone ? `${zn(s.zone)}${ZONES[s.zone].name}` : (s.kind === 'cover' ? '入口大廳 · 全景' : '全景回望 · 學習總結'); }
function panelMode(s){ return isMobile ? 'sheet' : (s.zone == null ? 'band' : 'side-' + ZONES[s.zone].side); }
function showPanel(i){
  const s = STOPS[i];
  panel.className = 'panel ' + panelMode(s);
  panel.innerHTML = renderStop(s, i);
  panel.scrollTop = 0;
  enhance(i);
  if (pendingTab){ const b = panel.querySelector(`[data-tab="${pendingTab}"]`); pendingTab = null; if (b) b.click(); }
}
function go(i, opt = {}){
  i = Math.max(0, Math.min(STOPS.length - 1, i));
  if (i === cur && !opt.force) return;
  const prev = cur; cur = i; seen.add(i);
  const s = STOPS[i];
  stopSim(); stopGeminiDemo();
  panel.querySelectorAll('video').forEach(v => v.pause());
  clearTimeout(panelTimer); clearTimeout(autoTimer);
  panel.classList.add('out');
  for (const k in frameEls) frameEls[k].classList.remove('on', 'show', 'st1', 'st2', 'st3', 'dim', 'hover');
  stage.classList.remove('is-ov');
  document.documentElement.classList.toggle('at-ov', s.zone == null);
  $('locNow').outerHTML = `<span class="now" id="locNow">${locHTML(s)}</span>`;
  updateDock();
  if (location.hash.slice(1) !== s.id && !opt.fromHash){ try { history.replaceState(null, '', '#' + s.id); } catch(e){} }
  const B = camFor(s), RB = rectFor(s);
  if (prev >= 0 && !opt.dur) SND.play('whoosh');
  const dur = fly(B, RB, opt.dur, () => arrive(i)) || 0;
  panelTimer = setTimeout(() => showPanel(i), reduce ? 0 : Math.max(260, dur * (prev < 0 ? 0.55 : 0.62)));
}
function arrive(i){
  if (i !== cur) return;
  const s = STOPS[i];
  if (seen.size > 1) SND.play('arrive');
  stage.style.setProperty('--k', (1 / camNow.s).toFixed(4));
  if (s.zone) frameEls[s.zone].classList.add('on');
  else {
    stage.classList.add('is-ov');
    if (s.kind === 'summary') for (const k in STAGE_OF) frameEls[k].classList.add('show', 'st' + STAGE_OF[k]);
  }
  if (auto) autoTimer = setTimeout(() => { if (cur < STOPS.length - 1) go(cur + 1); else setAuto(false); }, 9000);
}
function updateDock(){
  document.querySelectorAll('.node').forEach(n => { const i = +n.dataset.go; n.classList.toggle('cur', i === cur); n.classList.toggle('seen', seen.has(i) && i !== cur); n.setAttribute('aria-current', i === cur ? 'step' : 'false'); });
  document.querySelectorAll('.grp').forEach(g => g.classList.toggle('cur', +g.dataset.ch === STOPS[cur].chapter));
  $('prev').disabled = cur === 0; $('next').disabled = cur === STOPS.length - 1;
  const s = STOPS[cur];
  $('mcount').innerHTML = `<b>${s.zone ? s.no : (cur === 0 ? '入口' : '總結')} <span style="color:var(--muted);font-weight:500">/ ${STOPS.length - 2}</span></b><span>${CHAPTERS[s.chapter].name}${s.zone ? '｜' + ZONES[s.zone].name : ''}</span><span class="mbar"><i style="width:${cur / (STOPS.length - 1) * 100}%"></i></span>`;
}

/* ---------- panel extras ---------- */
function enhance(i){
  const s = STOPS[i];
  if (!reduce) panel.querySelectorAll('[data-count]').forEach(el => {
    const n = +el.dataset.count, t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / 900); el.textContent = Math.round(n * ease(t)); if (t < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  if (s.id === 'factory') startSim();
  if (s.id === 'jim') setTimeout(runGeminiDemo, 300);
}
let simIdx = 0, halted = false;
function startSim(){
  const sim = $('sim'); if (!sim) return;
  halted = false; simIdx = 0;
  const cells = sim.querySelectorAll('.grid9 li'), states = sim.querySelectorAll('.states li');
  const stepSim = () => {
    states.forEach((el, j) => el.classList.toggle('cur', j === simIdx % 5));
    cells.forEach((el, j) => el.classList.toggle('live', j === simIdx % 9));
    simIdx++;
  };
  stepSim();
  if (!reduce) simTimer = setInterval(stepSim, 1000);
}
function stopSim(){ clearInterval(simTimer); simTimer = null; }
function toggleEstop(){
  const sim = $('sim'); if (!sim) return;
  halted = !halted;
  sim.classList.toggle('halt', halted);
  $('estop').setAttribute('aria-pressed', String(halted));
  $('estopL').textContent = halted ? '確認危險排除，復歸' : '按下緊急停止';
  if (halted){ stopSim(); sim.querySelectorAll('.live,.cur').forEach(el => el.classList.remove('live', 'cur')); }
  else { simIdx = 0; startSim(); }
}

/* ---------- clean view: hide every control to show the whole studio ---------- */
function setClean(on){
  if (on === cleanMode || STOPS[cur].zone != null && on) return;
  cleanMode = on;
  if (on){ setAuto(false); hideTip(); }
  document.documentElement.classList.toggle('clean', on);
  fly(camFor(STOPS[cur]), rectFor(STOPS[cur]), 900, () => {});
  if (!on){ const b = panel.querySelector('[data-clean]'); if (b) b.focus({preventScroll:true}); }
}
document.addEventListener('click', e => { if (cleanMode){ e.preventDefault(); e.stopPropagation(); setClean(false); } }, true);
document.addEventListener('keydown', e => { if (cleanMode){ e.preventDefault(); e.stopImmediatePropagation(); setClean(false); } }, true);

/* ---------- Gemini notebook demo (auto-playing walkthrough) ---------- */
let gdToken = 0;
function stopGeminiDemo(){ gdToken++; }
function runGeminiDemo(){
  const box = document.getElementById('gdemo'); if (!box || box.offsetParent === null) return;
  const my = ++gdToken, q = k => box.querySelector(`[data-gd="${k}"]`);
  const win = box.querySelector('.gd-win'), cur = q('cursor');
  const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 150) : ms));
  const alive = () => my === gdToken && box.isConnected && box.offsetParent !== null;
  const step = n => q('steps').querySelectorAll('li').forEach((li, i) => li.classList.toggle('on', i === n));
  const point = async el => { const a = win.getBoundingClientRect(), b = el.getBoundingClientRect(); cur.style.left = (b.left - a.left + b.width / 2 - 7) + 'px'; cur.style.top = (b.top - a.top + b.height / 2 - 7) + 'px'; await wait(700); };
  const tap = async el => { await point(el); el.classList.add('hl'); cur.classList.add('tap'); await wait(180); cur.classList.remove('tap'); await wait(260); };
  const reset = () => {
    q('chat').innerHTML = '<p class="gd-hello">要從哪裡開始？</p>';
    ['menu', 'sub', 'pick', 'chip'].forEach(k => q(k).hidden = true);
    box.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    q('plus').classList.remove('on'); q('send').classList.remove('on');
    const t = q('text'); t.textContent = '輸入提示'; t.classList.remove('typed');
    cur.style.left = '75%'; cur.style.top = '40%'; step(-1);
  };
  (async () => {
    while (alive()) {
      reset(); await wait(900); if (!alive()) return;
      step(0); await tap(q('plus')); q('plus').classList.add('on'); q('menu').hidden = false; await wait(500); if (!alive()) return;
      step(1); await tap(q('more')); q('sub').hidden = false; await wait(450); if (!alive()) return;
      step(2); await tap(q('nb')); ['menu', 'sub'].forEach(k => q(k).hidden = true); q('plus').classList.remove('on'); q('pick').hidden = false; await wait(500); if (!alive()) return;
      step(3); await tap(q('pickitem')); await wait(300); q('pick').hidden = true; q('chip').hidden = false; await wait(500); if (!alive()) return;
      step(4); const t = q('text'), msg = '整理 Start with Why 的核心觀點，並標出處';
      t.textContent = ''; t.classList.add('typed');
      for (const ch of msg){ if (!alive()) return; t.textContent += ch; await wait(70); }
      q('send').classList.add('on'); await tap(q('send')); if (!alive()) return;
      q('chat').innerHTML = `<div class="gd-q">${msg}</div>`; t.textContent = '輸入提示'; t.classList.remove('typed'); q('chip').hidden = true; q('send').classList.remove('on');
      await wait(700); if (!alive()) return;
      step(5);
      const a = document.createElement('div'); a.className = 'gd-a'; q('chat').appendChild(a);
      const parts = ['根據筆記本中的影片，核心是「黃金圈」：', '由內而外先講 Why（為什麼做），再談 How（怎麼做），最後才是 What（做什麼）<sup>1</sup>。', '溝通時從理念出發，比從產品規格出發更能打動人<sup>2</sup>。'];
      for (const pt of parts){ if (!alive()) return; a.insertAdjacentHTML('beforeend', pt); await wait(650); }
      a.insertAdjacentHTML('beforeend', '<div class="gd-src"><span>1｜筆記本來源影片</span><span>2｜筆記本來源影片</span></div>');
      cur.style.left = '85%'; cur.style.top = '20%';
      await wait(4200);
    }
  })();
}

/* ---------- sound ---------- */
const SND = window.SFX || { play(){}, setOn(){ return false; }, on:false, wanted:false };
function paintSound(){
  const b = $('btnSound'), o = SND.on; b.setAttribute('aria-pressed', String(o));
  b.querySelector('.t').textContent = o ? '聲音開' : '聲音';
  $('soundIco').innerHTML = o ? '<path d="M2.5 6h2.6L8.5 3v10L5.1 10H2.5z" fill="currentColor"/><path d="M10.6 5.4a3.6 3.6 0 0 1 0 5.2M12.4 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' : '<path d="M2.5 6h2.6L8.5 3v10L5.1 10H2.5z" fill="currentColor"/><path d="M11 5.5l3.5 5M14.5 5.5l-3.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
}
$('btnSound').addEventListener('click', e => { e.stopPropagation(); SND.setOn(!SND.on); paintSound(); SND.play('click'); });
if (SND.wanted) document.addEventListener('pointerdown', function resume(e){ document.removeEventListener('pointerdown', resume, true); if (!SND.on && !e.target.closest('#btnSound')) { SND.setOn(true); paintSound(); } }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t || t.id === 'btnSound') return;
  if (t.matches('[data-tab]')) SND.play('tab');
  else if (t.matches('[data-lzq]')) SND.play('open');
  else if (!t.matches('[data-go], .node, #prev, #next, #btnHome, #brand, .hit')) SND.play('click');
}, true);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-lzq]')){ setAuto(false); if (window.LZQ) window.LZQ.open(); return; }
  const g = e.target.closest('[data-go]');
  if (g){ pendingTab = g.dataset.tabto || null; go(+g.dataset.go); return; }
  const qb = e.target.closest('[data-qr]');
  if (qb){ const pop = qb.closest('.tool').querySelector('.qr-pop'); pop.hidden = false; qb.setAttribute('aria-expanded', 'true'); pop.querySelector('button').focus(); return; }
  const qc = e.target.closest('[data-qr-close]');
  if (qc){ const t = qc.closest('.tool'); t.querySelector('.qr-pop').hidden = true; const b = t.querySelector('[data-qr]'); b.setAttribute('aria-expanded', 'false'); b.focus(); return; }
  const lb = $('lightbox');
  if (!lb.hidden){ lb.hidden = true; return; }
  const zb = e.target.closest('[data-zoom]');
  if (zb){ $('lbImg').src = zb.dataset.zoom; $('lbImg').alt = zb.dataset.cap; $('lbCap').textContent = zb.dataset.cap; lb.hidden = false; return; }
  const tb = e.target.closest('[data-tab]');
  if (tb){ const box = tb.closest('.p-body') || panel; box.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b === tb))); box.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== tb.dataset.tab; if (p.hidden) p.querySelectorAll('video').forEach(v => v.pause()); }); if (tb.dataset.tab === 'j1') setTimeout(runGeminiDemo, 100); else stopGeminiDemo(); return; }
  if (e.target.closest('#estop')){ toggleEstop(); return; }
  if (e.target.closest('[data-gd="replay"]')){ runGeminiDemo(); return; }
  if (e.target.closest('[data-clean]')){ setClean(true); return; }
  const h = e.target.closest('.hit');
  if (h){ const i = zoneStop[h.dataset.zone]; if (i !== cur) go(i); }
});
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
$('btnHome').onclick = () => go(0);
$('brand').onclick = () => go(0);
function setAuto(on){
  auto = on; clearTimeout(autoTimer);
  const b = $('btnAuto'); b.setAttribute('aria-pressed', String(on));
  b.querySelector('.t').textContent = on ? '暫停導覽' : '自動導覽';
  $('autoIco').innerHTML = on ? '<path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z" fill="currentColor"/>' : '<path d="M5 3.2v9.6L12.8 8z" fill="currentColor"/>';
  if (on){ if (cur === STOPS.length - 1) go(0); else autoTimer = setTimeout(() => go(cur + 1), 2500); }
}
$('btnAuto').onclick = () => setAuto(!auto);
$('btnFs').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { $('btnFs').disabled = true; $('btnFs').title = '此檢視環境不支援全螢幕'; }
};
$('mini').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * IW, y = (e.clientY - r.top) / r.height * IH;
  for (const k in ZONES){ const [zx, zy, zw, zh] = ZONES[k].rect; if (x >= zx && x <= zx + zw && y >= zy && y <= zy + zh){ go(zoneStop[k]); return; } }
  go(0);
};
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (document.documentElement.classList.contains('lzq-open')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select', 'video'].includes(tag)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !['button', 'a'].includes(tag))){ e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home'){ go(0); } else if (e.key === 'End'){ go(STOPS.length - 1); }
  else if (e.key === 'Escape' && !$('lightbox').hidden){ $('lightbox').hidden = true; }
  else if (e.key === 'Escape'){ document.querySelectorAll('.qr-pop').forEach(p => p.hidden = true); if (STOPS[cur].zone) go(0); }
});
// hover tooltips on zones and timeline nodes
function showTip(html, x, y){ tip.innerHTML = html; tip.classList.add('on'); const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(innerWidth - w - 10, x + 16) + 'px'; tip.style.top = Math.max(10, Math.min(innerHeight - h - 10, y - h - 14)) + 'px'; }
function hideTip(){ tip.classList.remove('on'); }
let hoverZone = null;
hitsEl.addEventListener('pointermove', e => {
  const h = e.target.closest('.hit'); if (!h || e.pointerType === 'touch') return;
  const k = h.dataset.zone, s = STOPS[zoneStop[k]];
  if (hoverZone !== k){ if (hoverZone) frameEls[hoverZone].classList.remove('hover'); hoverZone = k; frameEls[k].classList.add('hover'); }
  showTip(`<span class="s">${s.step} · ${ZONES[k].name}</span>${s.title}<span class="a">${zoneStop[k] === cur ? '目前位置' : '點擊前往這一區'}</span>`, e.clientX, e.clientY);
});
hitsEl.addEventListener('pointerleave', () => { if (hoverZone) frameEls[hoverZone].classList.remove('hover'); hoverZone = null; hideTip(); });
hitsEl.addEventListener('pointerout', e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.hit')){ if (hoverZone) frameEls[hoverZone].classList.remove('hover'); hoverZone = null; hideTip(); } });
tl.addEventListener('pointerover', e => { const n = e.target.closest('.node'); if (!n) return; const r = n.getBoundingClientRect(); showTip(n.dataset.tip, r.left - 10, r.top); });
tl.addEventListener('pointerout', e => { if (e.target.closest('.node')) hideTip(); });
// summary stage hover → light up zones
const stageHL = n => { for (const k in STAGE_OF) frameEls[k].classList.toggle('dim', n > 0 && STAGE_OF[k] !== n); };
panel.addEventListener('pointerover', e => { const st = e.target.closest('.stage'); if (st) stageHL(+st.dataset.stage); });
panel.addEventListener('pointerout', e => { const st = e.target.closest('.stage'); if (st && !st.contains(e.relatedTarget)) stageHL(0); });
panel.addEventListener('focusin', e => { const st = e.target.closest('.stage'); if (st) stageHL(+st.dataset.stage); });
panel.addEventListener('focusout', e => { if (e.target.closest('.stage')) stageHL(0); });
// swipe on scene
let tx0 = null, ty0 = null;
$('viewport').addEventListener('touchstart', e => { const t = e.touches[0]; tx0 = t.clientX; ty0 = t.clientY; }, {passive:true});
$('viewport').addEventListener('touchend', e => {
  if (tx0 == null || cleanMode) { tx0 = null; return; } const t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0; tx0 = null;
  if (Math.abs(dx) > 50 && Math.abs(dy) < 70) go(cur + (dx < 0 ? 1 : -1));
}, {passive:true});
addEventListener('hashchange', () => { const i = STOPS.findIndex(s => s.id === location.hash.slice(1)); if (i >= 0 && i !== cur) go(i, {fromHash:true}); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
  const was = isMobile; layout(); if (cur < 0) return; const s = STOPS[cur];
  flight = null; camNow = camFor(s); rectNow = rectFor(s);
  if (was !== isMobile || panel.classList.contains('band') !== (panelMode(s) === 'band')) showPanel(cur); else panel.className = 'panel ' + panelMode(s);
}, 120); });

/* ---------- ambient dust ---------- */
const cv = $('dust'), cx = cv.getContext('2d'); let P = [];
function sizeDust(){ const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0);
  const n = Math.round(innerWidth * innerHeight / 34000); P = Array.from({length:n}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:.5+Math.random()*1.5, a:.12+Math.random()*.35, v:.08+Math.random()*.25, p:Math.random()*6.28})); }
function dust(now){ cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const q of P){ q.y -= q.v; q.x += Math.sin(now/2400 + q.p) * .15; if (q.y < -4){ q.y = innerHeight + 4; q.x = Math.random()*innerWidth; }
    cx.globalAlpha = q.a * (0.6 + 0.4 * Math.sin(now/900 + q.p)); cx.fillStyle = q.r > 1.4 ? '#ffe2b0' : '#dfefff'; cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, 6.283); cx.fill(); }
  requestAnimationFrame(dust); }
if (!reduce){ sizeDust(); addEventListener('resize', sizeDust); requestAnimationFrame(dust); }

/* ---------- boot ---------- */
function start(data){
  layout();
  const fromHash = STOPS.findIndex(s => s.id === location.hash.slice(1));
  const target = data && Number.isInteger(data.i) ? data.i : (fromHash >= 0 ? fromHash : 0);
  const doors = $('doors');
  if (data && Number.isInteger(data.i)){ doors.classList.add('done'); }
  else doors.addEventListener('animationend', e => { if (e.target.classList.contains('r')) doors.classList.add('done'); });
  // establishing shot: eyes at the entrance, foreground lounge
  const v0 = {x:0, y:0, w:M.VW, h:M.VH};
  const s0 = Math.max(M.VW / IW, M.VH / IH) * (isMobile ? 1.15 : 1.55);
  const [tx0, ty0] = clampT(s0, M.VW/2 - 780 * s0, M.VH/2 - 800 * s0, v0);
  camNow = {s:s0, tx:tx0, ty:ty0, v:v0}; rectNow = FULL;
  requestAnimationFrame(tick);
  if (data && Number.isInteger(data.i)) go(target, {dur:0, force:true});
  else setTimeout(() => go(target, {dur: reduce ? 0 : 2600, force:true}), reduce ? 0 : 1100);
}
window.claude?.hot?.snapshot?.(() => ({i: cur}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
